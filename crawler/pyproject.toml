[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dca-crawler"
version = "0.1.0"
description = "Deterministic crawler providers (dca_*) for telecom plan extraction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.40",
  "openpyxl>=3.1.0",
  "nodriver>=0.38.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dca_*", "ai_agents_config"]

[tool.setuptools.package-data]
ai_agents_config = ["*.json"]
